:root{color-scheme:dark;--bg:#17171a;--fg:#ececec;--card:#222226;--bd:#3a3a40;--ac:#e8a48f;--mut:#aaa}

</style></head><body><main><p><a href='../index.html'>⬅ Torna all'indice</a></p><h1>05 - L&#x27;unità d&#x27;Italia e la Germania di Bismark</h1><h2>Immagini</h2><div class='grid'><figure><a href='00%20-%20Dal%20regno%20di%20Prussia%20all%27Impero%20tedesco.webp'><img loading='lazy' src='00%20-%20Dal%20regno%20di%20Prussia%20all%27Impero%20tedesco.webp' alt='Dal regno di Prussia all&#x27;Impero tedesco'></a><figcaption>Dal regno di Prussia all&#x27;Impero tedesco</figcaption></figure><figure><a href='01%20-%20Espansionismo%20prussiano%201807-1871.jpg'><img loading='lazy' src='01%20-%20Espansionismo%20prussiano%201807-1871.jpg' alt='Espansionismo prussiano 1807-1871'></a><figcaption>Espansionismo prussiano 1807-1871</figcaption></figure><figure><a href='02%20-%20Confederazione%20germanica.png'><img loading='lazy' src='02%20-%20Confederazione%20germanica.png' alt='Confederazione germanica'></a><figcaption>Confederazione germanica</figcaption></figure><figure><a href='03%20-%20Impero%20austro-ungarico.png'><img loading='lazy' src='03%20-%20Impero%20austro-ungarico.png' alt='Impero austro-ungarico'></a><figcaption>Impero austro-ungarico</figcaption></figure><figure><a href='04%20-%20Battaglia%20di%20Lissa.%20Affondamento%20della%20Re%20d%27Italia%20dopo%20lo%20speronamento.jpg'><img loading='lazy' src='04%20-%20Battaglia%20di%20Lissa.%20Affondamento%20della%20Re%20d%27Italia%20dopo%20lo%20speronamento.jpg' alt='Battaglia di Lissa. Affondamento della Re d&#x27;Italia dopo lo speronamento'></a><figcaption>Battaglia di Lissa. Affondamento della Re d&#x27;Italia dopo lo speronamento</figcaption></figure><figure><a href='05%20-%20Garibaldi.%20Obbedisco.jpg'><img loading='lazy' src='05%20-%20Garibaldi.%20Obbedisco.jpg' alt='Garibaldi. Obbedisco'></a><figcaption>Garibaldi. Obbedisco</figcaption></figure><figure><a href='06%20-%20Napoleone%20e%20Bismark.jpg'><img loading='lazy' src='06%20-%20Napoleone%20e%20Bismark.jpg' alt='Napoleone e Bismark'></a><figcaption>Napoleone e Bismark</figcaption></figure><figure><a href='07%20-%20Michele%20Cammarano%2C%20Bersaglieri%20Porta%20Pia.jpg'><img loading='lazy' src='07%20-%20Michele%20Cammarano%2C%20Bersaglieri%20Porta%20Pia.jpg' alt='Michele Cammarano, Bersaglieri Porta Pia'></a><figcaption>Michele Cammarano, Bersaglieri Porta Pia</figcaption></figure><figure><a href='08%20-%20Giornale%20breccia%20Porta%20Pia%20%2820.09.1870%29.jpg'><img loading='lazy' src='08%20-%20Giornale%20breccia%20Porta%20Pia%20%2820.09.1870%29.jpg' alt='Giornale breccia Porta Pia (20.09.1870)'></a><figcaption>Giornale breccia Porta Pia (20.09.1870)</figcaption></figure><figure><a href='09%20-%20Secondo%20Reich%20%281871-1918%29.png'><img loading='lazy' src='09%20-%20Secondo%20Reich%20%281871-1918%29.png' alt='Secondo Reich (1871-1918)'></a><figcaption>Secondo Reich (1871-1918)</figcaption></figure></div></main><!--LIGHTBOX--><style>
#lb{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;z-index:99;align-items:center;justify-content:center;flex-direction:column}
#lb.on{display:flex}
#lb img{max-width:96vw;max-height:84vh;object-fit:contain;user-select:none}
#lb .cap{color:#ececec;margin-top:.7rem;font-size:.95rem;text-align:center;padding:0 3rem}
#lb .cnt{color:#aaa;font-size:.8rem;margin-top:.2rem}
#lb button{position:absolute;background:#2226;border:1px solid #555;color:#fff;font-size:1.6rem;cursor:pointer;border-radius:8px;width:3rem;height:3rem}
#lb .p{left:.6rem;top:50%}#lb .n{right:.6rem;top:50%}#lb .x{right:.6rem;top:.6rem}
</style>
<div id="lb"><button class="x" aria-label="Chiudi">×</button><button class="p" aria-label="Precedente">‹</button><img alt=""><div class="cap"></div><div class="cnt"></div><button class="n" aria-label="Successivo">›</button></div>
<script>
(function(){var L=[].slice.call(document.querySelectorAll('.grid figure a'));if(!L.length)return;
var lb=document.getElementById('lb'),im=lb.querySelector('img'),cp=lb.querySelector('.cap'),ct=lb.querySelector('.cnt'),i=0;
function show(k){i=(k+L.length)%L.length;im.src=L[i].href;cp.textContent=L[i].parentNode.querySelector('figcaption').textContent;ct.textContent=(i+1)+' / '+L.length;
[1,-1].forEach(function(d){new Image().src=L[(i+d+L.length)%L.length].href})}
function open(k){show(k);lb.classList.add('on');document.body.style.overflow='hidden'}
function close(){lb.classList.remove('on');document.body.style.overflow='';im.src=''}
L.forEach(function(a,k){a.addEventListener('click',function(e){e.preventDefault();open(k)})});
lb.querySelector('.p').onclick=function(e){e.stopPropagation();show(i-1)};
lb.querySelector('.n').onclick=function(e){e.stopPropagation();show(i+1)};
lb.querySelector('.x').onclick=close;
lb.addEventListener('click',function(e){if(e.target===lb)close()});
document.addEventListener('keydown',function(e){if(!lb.classList.contains('on'))return;
if(e.key==='ArrowRight')show(i+1);else if(e.key==='ArrowLeft')show(i-1);else if(e.key==='Escape')close()});
var x0=null;lb.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
lb.addEventListener('touchend',function(e){if(x0===null)return;var d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)show(i+(d<0?1:-1));x0=null});
})();
</script></body></html>
