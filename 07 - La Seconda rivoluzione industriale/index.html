</style></head><body><main><p><a href='../index.html'>⬅ Torna all'indice</a></p><h1>07 - La Seconda rivoluzione industriale</h1><h2>Immagini</h2><div class='grid'><figure data-desc='Manifesto pubblicitario di Lucien Lefèvre (1897) per lampade a olio di lusso. Il nome del prodotto, «Electricine», richiama l&#x27;elettricità: la luce elettrica era diventata sinonimo di modernità e prestigio, e anche i prodotti che elettrici non erano cercavano di appropriarsene.'><a href='01%20-%20Electricine.%20%C3%89clairage%20de%20luxe%20di%20Lucien%20Lef%C3%A8vre%20%281897%29%20Pubblciit%C3%A0%20lampade%20ad%20olio.png'><img loading='lazy' src='01%20-%20Electricine.%20%C3%89clairage%20de%20luxe%20di%20Lucien%20Lef%C3%A8vre%20%281897%29%20Pubblciit%C3%A0%20lampade%20ad%20olio.png' alt='Electricine. Éclairage de luxe di Lucien Lefèvre (1897) Pubblciità lampade ad olio'></a><figcaption>Electricine. Éclairage de luxe di Lucien Lefèvre (1897) Pubblciità lampade ad olio</figcaption></figure><figure data-desc='Il pittore impressionista Camille Pissarro dipinge Parigi di notte, con il boulevard illuminato da lampioni e dalle vetrine. L&#x27;illuminazione artificiale ha cambiato le città: la sera non è più buia e la vita pubblica, i negozi e i caffè continuano anche dopo il tramonto.'><a href='02%20-%20Camille%20Pissarro%2C%20Boulevard%20Montmartre%2C%20effetto%20notte%20%281897%2C%20National%20Gallery%2C%20Londra%29.jpg'><img loading='lazy' src='02%20-%20Camille%20Pissarro%2C%20Boulevard%20Montmartre%2C%20effetto%20notte%20%281897%2C%20National%20Gallery%2C%20Londra%29.jpg' alt='Camille Pissarro, Boulevard Montmartre, effetto notte (1897, National Gallery, Londra)'></a><figcaption>Camille Pissarro, Boulevard Montmartre, effetto notte (1897, National Gallery, Londra)</figcaption></figure><figure data-desc='Van Gogh dipinge un caffè all&#x27;aperto di Arles illuminato di notte da una grande lampada a gas, il cui giallo domina la scena sul cielo blu. È uno dei primi quadri in cui l&#x27;artista rappresenta la notte senza usare il nero, grazie alla luce artificiale.'><a href='03%20-%20Vincent%20van%20Gogh%2C%20Terrazza%20del%20caff%C3%A8%20la%20sera%20%281888%29.jpg'><img loading='lazy' src='03%20-%20Vincent%20van%20Gogh%2C%20Terrazza%20del%20caff%C3%A8%20la%20sera%20%281888%29.jpg' alt='Vincent van Gogh, Terrazza del caffè la sera (1888)'></a><figcaption>Vincent van Gogh, Terrazza del caffè la sera (1888)</figcaption></figure><figure data-desc='Ancora Arles, ancora una notte: sul fiume Rodano si riflettono le luci a gas della città, accanto alle stelle del cielo. Luce naturale e luce artificiale convivono nello stesso paesaggio, segno di quanto l&#x27;illuminazione urbana fosse ormai una presenza abituale.'><a href='04%20-%20Vincent%20van%20Gogh%2C%20Notte%20stellata%20sul%20Rodano%20%281888%29.jpg'><img loading='lazy' src='04%20-%20Vincent%20van%20Gogh%2C%20Notte%20stellata%20sul%20Rodano%20%281888%29.jpg' alt='Vincent van Gogh, Notte stellata sul Rodano (1888)'></a><figcaption>Vincent van Gogh, Notte stellata sul Rodano (1888)</figcaption></figure><figure data-desc='Il futurista Umberto Boccioni rappresenta una rissa nella Galleria Vittorio Emanuele II a Milano, davanti a un caffè illuminato. I futuristi (il loro manifesto è del 1909) esaltavano la città moderna, il movimento e la luce elettrica, simboli del progresso tecnologico.'><a href='05%20-%20Umberto%20Boccioni%2C%20Rissa%20in%20galleria%20%281910%2C%20Pinacoteca%20di%20Brera%2C%20Milano%29.jpg'><img loading='lazy' src='05%20-%20Umberto%20Boccioni%2C%20Rissa%20in%20galleria%20%281910%2C%20Pinacoteca%20di%20Brera%2C%20Milano%29.jpg' alt='Umberto Boccioni, Rissa in galleria (1910, Pinacoteca di Brera, Milano)'></a><figcaption>Umberto Boccioni, Rissa in galleria (1910, Pinacoteca di Brera, Milano)</figcaption></figure><figure data-desc='L&#x27;artista italo-americano Joseph Stella dipinge il parco divertimenti di Coney Island, a New York, trasformato in un turbine di luci elettriche e colori. Risente dell&#x27;influenza dei futuristi: la luce elettrica diventa lo spettacolo stesso della città moderna.'><a href='06%20-%20Joseph%20Stella%2C%20Battaglia%20di%20luci%2C%20Coney%20Island%20%281913-14%2C%20Yale%20University%20Art%20Gallery%29.jpg'><img loading='lazy' src='06%20-%20Joseph%20Stella%2C%20Battaglia%20di%20luci%2C%20Coney%20Island%20%281913-14%2C%20Yale%20University%20Art%20Gallery%29.jpg' alt='Joseph Stella, Battaglia di luci, Coney Island (1913-14, Yale University Art Gallery)'></a><figcaption>Joseph Stella, Battaglia di luci, Coney Island (1913-14, Yale University Art Gallery)</figcaption></figure><figure data-desc='La pila di Alessandro Volta, annunciata nel 1800, è la prima batteria: dischi di metalli diversi separati da panni imbevuti di una soluzione acida o salina producono una corrente elettrica continua. Senza questa invenzione non sarebbero state possibili le applicazioni dell&#x27;elettricità dell&#x27;Ottocento.'><a href='07%20-%20Pila%20di%20Volta%20%28fine%20%27700%29.jpg'><img loading='lazy' src='07%20-%20Pila%20di%20Volta%20%28fine%20%27700%29.jpg' alt='Pila di Volta (fine &#x27;700)'></a><figcaption>Pila di Volta (fine &#x27;700)</figcaption></figure><figure data-desc='Nel 1871 Antonio Meucci depositò negli Stati Uniti un «caveat», una domanda provvisoria di brevetto, per un apparecchio che trasmetteva la voce. Il brevetto del telefono fu però ottenuto nel 1876 da Alexander Graham Bell. Nel 2002 la Camera dei rappresentanti americana ha riconosciuto il contributo di Meucci.'><a href='08%20-%20Antonio%20Meucci%2C%20Telefono%20%281871%29.png'><img loading='lazy' src='08%20-%20Antonio%20Meucci%2C%20Telefono%20%281871%29.png' alt='Antonio Meucci, Telefono (1871)'></a><figcaption>Antonio Meucci, Telefono (1871)</figcaption></figure><figure data-desc='Tasto telegrafico per trasmettere messaggi in codice Morse. Con il telegrafo senza fili di Guglielmo Marconi (le prime trasmissioni a distanza sono della fine dell&#x27;Ottocento) i messaggi viaggiavano via onde radio, senza bisogno di cavi, anche attraverso gli oceani.'><a href='09%20-%20Telegrafo%20senza%20fili.jpeg'><img loading='lazy' src='09%20-%20Telegrafo%20senza%20fili.jpeg' alt='Telegrafo senza fili'></a><figcaption>Telegrafo senza fili</figcaption></figure><figure data-desc='Il ponte di Brooklyn, a New York, fu inaugurato nel 1883 e unisce Manhattan a Brooklyn sopra l&#x27;East River. Progettato da John Roebling e completato dal figlio Washington, era sospeso con cavi d&#x27;acciaio ed era allora il ponte sospeso più lungo del mondo: un simbolo della potenza dell&#x27;ingegneria.'><a href='10%20-%20Ponte%20di%20Brooklyn.jpg'><img loading='lazy' src='10%20-%20Ponte%20di%20Brooklyn.jpg' alt='Ponte di Brooklyn'></a><figcaption>Ponte di Brooklyn</figcaption></figure><figure data-desc='La grande ruota panoramica, alta circa 80 metri, costruita da George Ferris per l&#x27;Esposizione universale di Chicago del 1893. Gli Stati Uniti volevano rispondere alla Torre Eiffel di Parigi (1889): le esposizioni universali erano la vetrina del progresso tecnico e industriale.'><a href='11%20-%20Ruota%20panoramica%20Ferris%20%28Chicago%201893%29.png'><img loading='lazy' src='11%20-%20Ruota%20panoramica%20Ferris%20%28Chicago%201893%29.png' alt='Ruota panoramica Ferris (Chicago 1893)'></a><figcaption>Ruota panoramica Ferris (Chicago 1893)</figcaption></figure><figure data-desc='Il Titanic, il più grande transatlantico dell&#x27;epoca, fu varato nel 1911 e affondò nell&#x27;aprile del 1912 durante il suo primo viaggio, dopo aver urtato un iceberg. Era considerato quasi inaffondabile: il naufragio incrinò la fiducia assoluta nella tecnologia.'><a href='12%20-%20Titanic%20%281911%29.jpg'><img loading='lazy' src='12%20-%20Titanic%20%281911%29.jpg' alt='Titanic (1911)'></a><figcaption>Titanic (1911)</figcaption></figure><figure data-desc='Macchina fotografica a soffietto, di tipo diffuso tra Otto e Novecento. Dopo la pellicola in rullo di Kodak (1888) la fotografia smise di essere un&#x27;arte per pochi professionisti e divenne alla portata di molti.'><a href='13%20-%20Macchina%20fotografica%20nel%20XIX%20secolo.jpg'><img loading='lazy' src='13%20-%20Macchina%20fotografica%20nel%20XIX%20secolo.jpg' alt='Macchina fotografica nel XIX secolo'></a><figcaption>Macchina fotografica nel XIX secolo</figcaption></figure><figure data-desc='Manifesto pubblicitario del Cinématographe dei fratelli Lumière. La prima proiezione pubblica a pagamento ebbe luogo a Parigi il 28 dicembre 1895. Nasce così il cinema, un&#x27;industria dello spettacolo di massa.'><a href='14%20-%20Fratelli%20Lumi%C3%A8res.%20Cinematografo%20%281895%29.png'><img loading='lazy' src='14%20-%20Fratelli%20Lumi%C3%A8res.%20Cinematografo%20%281895%29.png' alt='Fratelli Lumières. Cinematografo (1895)'></a><figcaption>Fratelli Lumières. Cinematografo (1895)</figcaption></figure><figure data-desc='La Benz Velo del 1894 è considerata la prima automobile prodotta in serie, con più di mille esemplari costruiti. L&#x27;automobile con motore a scoppio, nata dalle ricerche di Karl Benz e di altri inventori, apre la strada alla mobilità di massa.'><a href='16%20-%20Carl%20Benz.%20Benz%20Velo%20%281894%29.jpg'><img loading='lazy' src='16%20-%20Carl%20Benz.%20Benz%20Velo%20%281894%29.jpg' alt='Carl Benz. Benz Velo (1894)'></a><figcaption>Carl Benz. Benz Velo (1894)</figcaption></figure></div><h2>Video</h2><video controls preload='metadata' style='width:100%;max-width:640px;border-radius:10px' src='15%20-%20Auguste%20%26%20Louis%20Lumi%C3%A8re%20-%20Innaffiatore%20innaffiato.mp4'></video><p><a class='btn' href='15%20-%20Auguste%20%26%20Louis%20Lumi%C3%A8re%20-%20Innaffiatore%20innaffiato.mp4'>Auguste &amp; Louis Lumière - Innaffiatore innaffiato (MP4)</a></p></main><!--LIGHTBOX--><style>
#lb{position:fixed;inset:0;background:#000;display:none;z-index:99;align-items:center;justify-content:center;flex-direction:column}
#lb.on{display:flex}
#lb img{max-width:96vw;max-height:86vh;object-fit:contain;user-select:none}
#lb .cap{color:#ececec;margin-top:.4rem;font-size:.9rem;text-align:center;padding:0 3rem}
#lb .dsc{position:absolute;left:50%;bottom:4.2rem;transform:translateX(-50%);width:min(92vw,760px);max-height:55vh;overflow:auto;background:#111f;border:1px solid #666;border-radius:10px;color:#e6e6e6;font-size:1rem;line-height:1.5;padding:1rem 1.2rem;display:none;box-shadow:0 8px 30px #000}
#lb .dsc.on{display:block}
@media(min-width:801px){#lb.side{padding-right:370px}#lb.side img{max-width:calc(100vw - 420px)}#lb .dsc{left:auto;right:1rem;bottom:auto;top:4.5rem;transform:none;width:340px;max-height:calc(100vh - 9rem);font-size:1.02rem}}
#lb .ctx{left:.6rem;top:.6rem;width:auto;height:auto;font-size:.95rem;padding:.55rem .9rem;display:none}
#lb .ctx.on{display:block}
#lb .cnt{color:#aaa;font-size:.8rem;margin-top:.2rem}
#lb button{position:absolute;background:#2226;border:1px solid #555;color:#fff;font-size:1.6rem;cursor:pointer;border-radius:8px;width:3rem;height:3rem}
#lb .p{left:.6rem;top:50%}#lb .n{right:.6rem;top:50%}#lb .x{right:.6rem;top:.6rem}
</style>
<div id="lb"><button class="ctx">Contesto</button><button class="x" aria-label="Chiudi">×</button><button class="p" aria-label="Precedente">‹</button><img alt=""><div class="cap"></div><div class="dsc"></div><div class="cnt"></div><button class="n" aria-label="Successivo">›</button></div>
<script>
(function(){var L=[].slice.call(document.querySelectorAll('.grid figure a'));if(!L.length)return;
var lb=document.getElementById('lb'),im=lb.querySelector('img'),cp=lb.querySelector('.cap'),ct=lb.querySelector('.cnt'),ds=lb.querySelector('.dsc'),cx=lb.querySelector('.ctx'),i=0;
function show(k){i=(k+L.length)%L.length;im.src=L[i].href;cp.textContent=L[i].parentNode.querySelector('figcaption').textContent;var d=L[i].parentNode.getAttribute('data-desc')||'';ds.textContent=d;ds.classList.remove('on');lb.classList.remove('side');cx.classList.toggle('on',!!d);cx.textContent='Contesto';ct.textContent=(i+1)+' / '+L.length;
[1,-1].forEach(function(d){new Image().src=L[(i+d+L.length)%L.length].href})}
function open(k){show(k);lb.classList.add('on');document.body.style.overflow='hidden'}
function close(){lb.classList.remove('on');lb.classList.remove('side');document.body.style.overflow='';im.src=''}
L.forEach(function(a,k){a.addEventListener('click',function(e){e.preventDefault();open(k)})});
lb.querySelector('.p').onclick=function(e){e.stopPropagation();show(i-1)};
lb.querySelector('.n').onclick=function(e){e.stopPropagation();show(i+1)};
lb.querySelector('.x').onclick=close;
function tg(){var o=ds.classList.toggle('on');lb.classList.toggle('side',o);cx.textContent=o?'Nascondi contesto':'Contesto'}
cx.onclick=function(e){e.stopPropagation();tg()};ds.onclick=function(e){e.stopPropagation();tg()};
lb.addEventListener('click',function(e){if(e.target===lb)close()});
document.addEventListener('keydown',function(e){if(!lb.classList.contains('on'))return;
if(e.key==='ArrowRight')show(i+1);else if(e.key==='ArrowLeft')show(i-1);else if((e.key==='c'||e.key==='C')&&cx.classList.contains('on'))tg();else if(e.key==='Escape'){if(ds.classList.contains('on'))tg();else close()}});
var x0=null;lb.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
lb.addEventListener('touchend',function(e){if(x0===null)return;var d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)show(i+(d<0?1:-1));x0=null});
})();
</script></body></html>
