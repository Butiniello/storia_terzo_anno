<!doctype html><html lang='it'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>08 - La questione operaia – Storia – Terzo anno</title><style>
:root{color-scheme:dark;--bg:#17171a;--fg:#ececec;--card:#222226;--bd:#3a3a40;--ac:#e8a48f;--mut:#aaa}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;line-height:1.55}
main{max-width:920px;margin:0 auto;padding:2rem 1rem 4rem}
h1{font-size:2rem;margin:.2rem 0 .3rem}h2{margin-top:2rem;border-bottom:1px solid var(--bd);padding-bottom:.3rem}

</style></head><body><main><p><a href='../index.html'>⬅ Torna all'indice</a></p><h1>08 - La questione operaia</h1><h2>Immagini</h2><div class='grid'><figure><a href='01%20-%20Luddismo.jpg'><img loading='lazy' src='01%20-%20Luddismo.jpg' alt='Luddismo'></a><figcaption>Luddismo</figcaption></figure><figure><a href='02%20-%20Karl%20Marx.png'><img loading='lazy' src='02%20-%20Karl%20Marx.png' alt='Karl Marx'></a><figcaption>Karl Marx</figcaption></figure><figure><a href='03%20-%20Friedrich%20Engels.jpg'><img loading='lazy' src='03%20-%20Friedrich%20Engels.jpg' alt='Friedrich Engels'></a><figcaption>Friedrich Engels</figcaption></figure><figure><a href='04%20-%20I%20simboli%20del%20Comunismo.png'><img loading='lazy' src='04%20-%20I%20simboli%20del%20Comunismo.png' alt='I simboli del Comunismo'></a><figcaption>I simboli del Comunismo</figcaption></figure><figure><a href='05%20-%20Proletari%20di%20tutto%20il%20mondo%20unitevi.png'><img loading='lazy' src='05%20-%20Proletari%20di%20tutto%20il%20mondo%20unitevi.png' alt='Proletari di tutto il mondo unitevi'></a><figcaption>Proletari di tutto il mondo unitevi</figcaption></figure><figure><a href='06%20-%20Numero%20speciale%20Gl%C3%BChlichter%206.6.1904.jpg'><img loading='lazy' src='06%20-%20Numero%20speciale%20Gl%C3%BChlichter%206.6.1904.jpg' alt='Numero speciale Glühlichter 6.6.1904'></a><figcaption>Numero speciale Glühlichter 6.6.1904</figcaption></figure><figure data-desc='Vignetta satirica pubblicata dalla rivista britannica Punch nel 1843. In alto i ricchi vivono nell&#x27;ozio e nel lusso, serviti e circondati di comodità; in basso, nel sottosuolo, uomini, donne e bambini sfiniti lavorano e vivono nella miseria. A sinistra la Speranza, con la sua àncora, resta chiusa fuori dalla porta. Denuncia lo sfruttamento del lavoro, anche minorile, nelle miniere britanniche, oggetto di un&#x27;inchiesta ufficiale nel 1842.'><a href='07%20-%20Capitale%20e%20lavoro.%20La%20Speranza%20chiusa%20fuori%20%28Rivista%20Punch%201843%29.png'><img loading='lazy' src='07%20-%20Capitale%20e%20lavoro.%20La%20Speranza%20chiusa%20fuori%20%28Rivista%20Punch%201843%29.png' alt='Capitale e lavoro. La Speranza chiusa fuori (Rivista Punch 1843)'></a><figcaption>Capitale e lavoro. La Speranza chiusa fuori (Rivista Punch 1843)</figcaption></figure><figure><a href='08%20-%20Incipit%20Manifesto%20Partito%20comunista.jpg'><img loading='lazy' src='08%20-%20Incipit%20Manifesto%20Partito%20comunista.jpg' alt='Incipit Manifesto Partito comunista'></a><figcaption>Incipit Manifesto Partito comunista</figcaption></figure></div></main><!--LIGHTBOX--><style>
#lb{position:fixed;inset:0;background:rgba(0,0,0,.97);display:none;z-index:99;align-items:center;justify-content:center;flex-direction:column}
#lb.on{display:flex}
#lb img{max-width:96vw;max-height:72vh;object-fit:contain;user-select:none}
#lb .cap{color:#ececec;margin-top:.7rem;font-size:.95rem;text-align:center;padding:0 3rem}
#lb .dsc{color:#d8d8d8;font-size:.9rem;line-height:1.45;max-width:820px;max-height:14vh;overflow:auto;margin-top:.4rem;padding:0 3.2rem;text-align:left}
#lb .dsc:empty{display:none}
#lb .cnt{color:#aaa;font-size:.8rem;margin-top:.2rem}
#lb button{position:absolute;background:#2226;border:1px solid #555;color:#fff;font-size:1.6rem;cursor:pointer;border-radius:8px;width:3rem;height:3rem}
#lb .p{left:.6rem;top:50%}#lb .n{right:.6rem;top:50%}#lb .x{right:.6rem;top:.6rem}
</style>
<div id="lb"><button class="x" aria-label="Chiudi">×</button><button class="p" aria-label="Precedente">‹</button><img alt=""><div class="cap"></div><div class="dsc"></div><div class="cnt"></div><button class="n" aria-label="Successivo">›</button></div>
<script>
(function(){var L=[].slice.call(document.querySelectorAll('.grid figure a'));if(!L.length)return;
var lb=document.getElementById('lb'),im=lb.querySelector('img'),cp=lb.querySelector('.cap'),ct=lb.querySelector('.cnt'),ds=lb.querySelector('.dsc'),i=0;
function show(k){i=(k+L.length)%L.length;im.src=L[i].href;cp.textContent=L[i].parentNode.querySelector('figcaption').textContent;ds.textContent=L[i].parentNode.getAttribute('data-desc')||'';ct.textContent=(i+1)+' / '+L.length;
[1,-1].forEach(function(d){new Image().src=L[(i+d+L.length)%L.length].href})}
function open(k){show(k);lb.classList.add('on');document.body.style.overflow='hidden'}
function close(){lb.classList.remove('on');document.body.style.overflow='';im.src=''}
L.forEach(function(a,k){a.addEventListener('click',function(e){e.preventDefault();open(k)})});
lb.querySelector('.p').onclick=function(e){e.stopPropagation();show(i-1)};
lb.querySelector('.n').onclick=function(e){e.stopPropagation();show(i+1)};
lb.querySelector('.x').onclick=close;
lb.addEventListener('click',function(e){if(e.target===lb)close()});
document.addEventListener('keydown',function(e){if(!lb.classList.contains('on'))return;
if(e.key==='ArrowRight')show(i+1);else if(e.key==='ArrowLeft')show(i-1);else if(e.key==='Escape')close()});
var x0=null;lb.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
lb.addEventListener('touchend',function(e){if(x0===null)return;var d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)show(i+(d<0?1:-1));x0=null});
})();
</script></body></html>
